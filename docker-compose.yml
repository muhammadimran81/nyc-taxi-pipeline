services:
  # Airflow's own metadata database
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # The analytics warehouse the pipeline loads into (connect from DBeaver/pgAdmin on localhost:5433)
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-dw}
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db:/var/lib/postgresql/data
      - ./sql/init_warehouse.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dw", "-d", "warehouse"]
      interval: 5s
      retries: 10

  # Airflow 3 in standalone mode (scheduler, API server, DAG processor, triggerer in one container)
  airflow:
    build: .
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # local dev only: no login screen
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      WAREHOUSE_URI: postgresql://dw:${WAREHOUSE_PASSWORD:-dw}@warehouse:5432/warehouse
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-dw}
      PIPELINE_DATA_DIR: /opt/airflow/data
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy

volumes:
  airflow-db:
  warehouse-db:
