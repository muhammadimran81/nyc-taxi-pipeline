version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: yellow_trips
        description: Cleaned yellow-taxi trips loaded by the Airflow pipeline, one partition per trip_month.
        columns:
          - name: pickup_at
            data_tests: [not_null]
      - name: taxi_zones
        description: TLC taxi zone lookup.
        columns:
          - name: location_id
            data_tests: [unique, not_null]
